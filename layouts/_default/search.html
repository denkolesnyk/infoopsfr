{{ partial "head.html" . }}
<link href="{{ "pagefind/pagefind-ui.css" | absURL }}" rel="stylesheet" />

<body>
    {{ partial "header.html" . }}
    <main class="content wrap" id="contenu">
        <div class="search-container">
            <h1 class="page_heading">{{ .Title }}</h1>
            <div id="search"></div>
            <noscript>
                <p class="search_noscript">La recherche nécessite JavaScript. Vous pouvez parcourir
                l'<a href="{{ "posts/" | absURL }}">archive</a> ou les <a href="{{ "tags/" | absURL }}">tags</a>.</p>
            </noscript>
        </div>
    </main>
    <a id="back_to_top" href="#" class="back_to_top" aria-label="{{ i18n "back_to_top" }}">{{ partial "icon.html" "arrow-up" }}</a>
    {{ partial "footer.html" . }}
    {{ partial "js.html" . }}
    <script src="{{ "pagefind/pagefind-ui.js" | absURL }}"></script>
    <script>
      window.addEventListener('DOMContentLoaded', function () {
        new PagefindUI({
          element: "#search",
          showSubResults: true,
          showImages: false,
          translations: {
            placeholder: "Rechercher dans les publications",
            clear_search: "Effacer",
            load_more: "Afficher plus de résultats",
            search_label: "Rechercher sur ce site",
            filters_label: "Filtres",
            zero_results: "Aucun résultat pour [SEARCH_TERM]",
            many_results: "[COUNT] résultats pour [SEARCH_TERM]",
            one_result: "[COUNT] résultat pour [SEARCH_TERM]",
            alt_search: "Aucun résultat pour [SEARCH_TERM]. Résultats affichés pour [DIFFERENT_TERM]",
            search_suggestion: "Aucun résultat pour [SEARCH_TERM]. Essayez l'une de ces recherches :",
            searching: "Recherche en cours…"
          }
        });
      });
    </script>
</body>

</html>
