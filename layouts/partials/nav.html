<div class="nav_container">
    <nav class="site_nav" id="site_nav" aria-label="Navigation principale">
        <ul>
            {{- $currentPage := . }}
            {{- range .Site.Menus.main }}
            {{- $active := or (eq $currentPage.RelPermalink .URL) (and (ne .URL "/") (hasPrefix $currentPage.RelPermalink .URL)) }}
            <li{{ if $active }} class="active"{{ end }}>
                <a href="{{ .URL | safeURL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a>
            </li>
            {{- end }}
        </ul>
    </nav>
    <div class="nav_actions">
        <button type="button" id="theme_toggle" class="theme_toggle"
                aria-label="{{ i18n "theme_toggle" }}" title="{{ i18n "theme_toggle" }}"
                data-label-light="{{ i18n "theme_light" }}" data-label-dark="{{ i18n "theme_dark" }}" hidden>
            <span class="theme_icon theme_icon_sun">{{ partial "icon.html" "sun" }}</span>
            <span class="theme_icon theme_icon_moon">{{ partial "icon.html" "moon" }}</span>
        </button>
        <div class="menu_icon">
            <button type="button" id="menu_icon" aria-controls="site_nav" aria-expanded="false" aria-label="{{ i18n "menu" }}">
                {{ partial "icon.html" "menu" }}
            </button>
        </div>
    </div>
</div>
