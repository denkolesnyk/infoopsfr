{{ partial "head.html" . }}
<link href="{{ "pagefind/pagefind-ui.css" | absURL }}" rel="stylesheet" />

<body>
    {{ partial "header.html" . }}
    <main class="content wrap">
        <div class="not_found">
            <p class="not_found_code">404</p>
            <h1>Page introuvable</h1>
            <p class="not_found_hint">Cette page n'existe pas ou a été déplacée.</p>
            <div id="search404"></div>
            <a href="{{ .Site.BaseURL }}" class="home_link">← Retour à l'accueil</a>
        </div>
    </main>
    {{ partial "footer.html" . }}
    {{ partial "js.html" . }}
    <script src="{{ "pagefind/pagefind-ui.js" | absURL }}"></script>
    <script>
      window.addEventListener('DOMContentLoaded', function () {
        new PagefindUI({
          element: "#search404",
          showSubResults: false,
          showImages: false,
          translations: {
            placeholder: "Rechercher…",
            zero_results: "Aucun résultat pour [SEARCH_TERM]",
            many_results: "[COUNT] résultats pour [SEARCH_TERM]",
            one_result: "[COUNT] résultat pour [SEARCH_TERM]"
          }
        });
      });
    </script>
</body>

</html>
