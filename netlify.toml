# Les fichiers ci-dessous sont versionnés par leur nom : quand le contenu
# change, le nom change. On peut donc les mettre en cache longtemps.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Vignettes de partage générées : le nom porte une empreinte.
[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Polices : fichiers figés, jamais modifiés en place.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Le script passe par le pipeline Hugo (main.<empreinte>.js) : cache long.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Index de recherche : régénéré à chaque build, mais les fragments et shards
# portent un hash dans leur nom.
[[headers]]
  for = "/pagefind/fragment/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/pagefind/index/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# En-têtes de sécurité pour tout le site. Le motif « /*.html » utilisé
# auparavant ne s'appliquait jamais : les pages sont demandées en
# /posts/…/, sans « .html ». Pas de Cache-Control ici : Netlify revalide
# déjà le HTML par défaut (max-age=0, must-revalidate), et les règles
# ci-dessus fixent celui des fichiers statiques.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
