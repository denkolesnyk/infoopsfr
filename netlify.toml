[build]
  command = "hugo --gc --minify && npx -y pagefind@1.4.0 --site public"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.166.0"
  HUGO_ENV = "production"
  HUGO_ENABLEGITINFO = "true"

# La taxonomie « series » a été renommée « bulletins », et la série 2022
# « La France dans les médias russes » n'est plus une série : ses articles
# restent dans l'archive. Les règles les plus spécifiques d'abord, Netlify
# appliquant la première qui correspond.
[[redirects]]
  from = "/series/la-france-dans-les-médias-russes/"
  to = "/posts/"
  status = 301
  force = true

[[redirects]]
  from = "/bulletins/la-france-dans-les-médias-russes/"
  to = "/posts/"
  status = 301
  force = true

[[redirects]]
  from = "/bulletins/la-france-dans-les-medias-russes/"
  to = "/posts/"
  status = 301
  force = true

[[redirects]]
  from = "/series/"
  to = "/bulletins/"
  status = 301
  force = true

[[redirects]]
  from = "/series/*"
  to = "/bulletins/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/bulletins/présidentielle-2027/"
  to = "/bulletins/presidentielle-2027/"
  status = 301
  force = true

[[redirects]]
  from = "/tags/présidentielle-2027/"
  to = "/bulletins/presidentielle-2027/"
  status = 301
  force = true

[[redirects]]
  from = "/tags/désinformation/"
  to = "/tags/desinformation/"
  status = 301
  force = true

[[redirects]]
  from = "/tags/guerre-non-cinétique/"
  to = "/tags/guerre-informationnelle/"
  status = 301
  force = true

# Tags regroupés (octobre 2026) : 16 tags ramenés à 9. Les anciennes
# adresses renvoient vers le tag qui les a absorbés.
[[redirects]]
  from = "/tags/presidentielle-2027/"
  to = "/bulletins/presidentielle-2027/"
  status = 301
  force = true

[[redirects]]
  from = "/tags/mali/"
  to = "/tags/afrique/"
  status = 301
  force = true

[[redirects]]
  from = "/tags/burkina-faso/"
  to = "/tags/afrique/"
  status = 301
  force = true

[[redirects]]
  from = "/tags/centrafrique/"
  to = "/tags/afrique/"
  status = 301
  force = true

[[redirects]]
  from = "/tags/grey_zone/"
  to = "/tags/telegram/"
  status = 301
  force = true

[[redirects]]
  from = "/tags/guerre-cognitive/"
  to = "/tags/guerre-informationnelle/"
  status = 301
  force = true

[[redirects]]
  from = "/tags/guerre-mentale/"
  to = "/tags/guerre-informationnelle/"
  status = 301
  force = true

[[redirects]]
  from = "/tags/guerre-non-cinetique/"
  to = "/tags/guerre-informationnelle/"
  status = 301
  force = true

[[redirects]]
  from = "/tags/twitter/"
