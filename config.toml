baseURL = "https://infoops.fr"
locale = "fr"
defaultContentLanguage = "fr"
title = "Info Ops France"
summaryLength = 40
enableEmoji = false
# Français : pas de Title Case sur les titres de listes/taxonomies.
capitalizeListTitles = false
# URL sans accents : /bulletins/presidentielle-2027/ plutôt que la version
# percent-encodée. Les anciennes adresses sont redirigées dans netlify.toml.
removePathAccents = true

[pagination]
  # Accueil : un article à la une et six en liste.
  pagerSize = 7

[taxonomies]
  tag = "tags"
  bulletin = "bulletins"

[[menu.main]]
  name = "Accueil"
  weight = 10
  identifier = "accueil"
  url = "/"
[[menu.main]]
  # Une seule série pour l'instant : le menu la nomme et pointe droit
  # dessus. À remplacer par « Bulletins » → /bulletins/ dès qu'une
  # deuxième série existe.
  name = "Présidentielle 2027"
  weight = 20
  identifier = "bulletins"
  url = "/bulletins/presidentielle-2027/"
[[menu.main]]
  name = "Archive"
  weight = 30
  identifier = "archive"
  url = "/posts/"
[[menu.main]]
  name = "À propos"
  weight = 40
  identifier = "a-propos"
  url = "/a-propos/"

[params]
  author = "Denys Kolesnyk"
  subTitle = "« L’esprit des nations belligérantes est la 4ème dimension [de la guerre] »"
  subTitleAuthor = "Evgueni Messner"
  keywords = ["Info Ops France","désinformation","infoguerre"]
  description = "L’initiative Info Ops France a pour but d’améliorer la résilience informationnelle de la société française."
  enableMathJax = false
  enableSummary = true
  mainSections = ["posts","post"]

  [params.social]
    twitter = "https://x.com/infoopsfr"
    facebook = "https://www.facebook.com/infoopsfr/"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  # Attributs de bloc : permet {caption="…"} sous un tableau.
  [markup.goldmark.parser.attribute]
    block = true
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
