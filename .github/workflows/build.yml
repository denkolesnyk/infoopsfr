name: Build

# Netlify is the production deploy (see netlify.toml). This workflow only
# checks that the site still builds — keep HUGO_VERSION identical to the one
# pinned in netlify.toml so the two cannot drift apart.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  HUGO_VERSION: '0.163.3'
  PAGEFIND_VERSION: '1.4.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build
        run: hugo --gc --minify

      - name: Index search (Pagefind)
        run: npx -y pagefind@${{ env.PAGEFIND_VERSION }} --site public

      - name: Check search index was produced
        run: test -f public/pagefind/pagefind-ui.js
